name: Reusable Build & Deploy Logic

on:
  workflow_call:
    inputs:
      image_name:
        description: Como se llamará la imagen en Docker Hub (solo el nombre, sin el usuario)
        required: true
        type: string
      image_tag:
        description: Tag que identificará esta versión (por ejemplo el identificador del commit)
        required: true
        type: string
      push_image:
        description: Controla si la imagen se sube a Docker Hub (True solo en Release)
        required: true
        type: boolean
    secrets:
      DOCKER_USERNAME:
        required: true
      DOCKER_PASSWORD:
        required: true


jobs:
  deps-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: 1. Checkout de código fuente
        uses: actions/checkout@v4

      - name: 2. Instalación de Dependencias (npm)
        run: npm install

      - name: 3. Validación de Calidad (Test)
        run: npm test
  docker-build_image:
    needs: deps-and-test
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout de código fuente
        uses: actions/checkout@v4

      - name: 2. Construcción de Imagen Docker (Build)
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/${{ inputs.image_name   }}:${{ inputs.image_tag}}

      - name: 3. Login to Docker Hub
        if: ${{  inputs.push_image == true }}
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD}}

      - name: 4.  Push de Imagen docker
        if: ${{  inputs.push_image == true }}
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ inputs.image_name   }}:${{ inputs.image_tag}}
