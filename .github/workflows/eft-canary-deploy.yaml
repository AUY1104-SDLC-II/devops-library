#Workflow reutilizable Deploy estrategia Canary en K8s
name: EFT - Deploy estrategia Canary en k8s

on:
  workflow_call:
    inputs:
      stable_image:
        description: Imagen Estable que debe proteger el despliegue
        required: true
        type: string
      server_ip:
        description: IP Pública de la instancia EC2 con k3s
        required: true
        type: string
      image_name:
        description: Nombre del repositorio de imagen Docker
        required: false
        default: auy1104-app
        type: string
      namespace:
        description: Namespace Kubernetes de destino
        required: false
        default: canary-orders
        type: string
    secrets:
      DOCKER_USERNAME:
        required: true
      EA2_SSH_PRIVATE_KEY:
        required: true

permissions:
  contents: read

jobs:
  deploy-canary:
    runs-on: ubuntu-latest
    env:
      SERVER_IP: ${{ inputs.server_ip }}
      STABLE_IMAGE: ${{ inputs.stable_image }}
      CANARY_IMAGE: ${{ secrets.DOCKER_USERNAME }}/${{ inputs.image_name }}:${{ github.sha }}
      NAMESPACE: ${{ inputs.namespace }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Start SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EA2_SSH_PRIVATE_KEY }}

      - name: Render Canary manifests
        run: |
          set -e
          sed "s|canary-orders|${NAMESPACE}|g" \
            k8s/canary-namespace.yaml \
            > /tmp/canary-namespace.yaml
          
          sed -e "s|STABLE_IMAGE_PLACEHOLDER|${STABLE_IMAGE}|g" \
            -e "s|canary-orders|${NAMESPACE}|g" \
            k8s/canary-stable-deployment.yaml \
            > /tmp/canary-stable-deployment.yaml
          
          sed -e "s|CANARY_IMAGE_PLACEHOLDER|${CANARY_IMAGE}|g" \
            -e "s|canary-orders|${NAMESPACE}|g" \
            k8s/canary-deployment.yaml \
            > /tmp/canary-deployment.yaml
          
          sed "s|canary-orders|${NAMESPACE}|g" \
            k8s/canary-service.yaml \
            > /tmp/canary-service.yaml

      - name: Copy Canary manifest to k3s server
        run: |
          scp -o StrictHostKeyChecking=accept-new \
            /tmp/canary-namespace.yaml \
            /tmp/canary-stable-deployment.yaml \
            /tmp/canary-deployment.yaml \
            /tmp/canary-service.yaml \
            ubuntu@${SERVER_IP}:/tmp/

      - name: Deploy Canary stack to K3s
        run: |
          ssh -o StrictHostKeyChecking=accept-new \
            ubuntu@${SERVER_IP} \
            "NAMESPACE='${NAMESPACE}' bash -s" << 'EOF'
          set -e
          #Implementar manifiestos
          sudo k3s kubectl apply -f /tmp/canary-namespace.yaml
          sudo k3s kubectl apply -f /tmp/canary-stable-deployment.yaml
          sudo k3s kubectl apply -f /tmp/canary-service.yaml
          sudo k3s kubectl rollout status deployment/orders-api-stable -n "${NAMESPACE}" --timeout=120s
          sudo k3s kubectl apply -f /tmp/canary-deployment.yaml
          sudo k3s kubectl rollout status deployment/orders-api-canary -n "${NAMESPACE}" --timeout=120s
          
          
          #Validar funcionamiento
          sudo k3s kubectl get deployments -n "${NAMESPACE}"
          sudo k3s kubectl get pods -n "${NAMESPACE}" --show-labels
          sudo k3s kubectl get svc -n "${NAMESPACE}"
          EOF

      - name: Verify Stable public endpoint
        run: |
          curl -fsS --retry 3 --max-time 10 \
            http://${SERVER_IP}:30080/health

      - name: Verify Canary health
        run: |
          ssh -o StrictHostKeyChecking=accept-new \
            ubuntu@${SERVER_IP} \
            "NAMESPACE='${NAMESPACE}' bash -s" << 'EOF'
          set -e
          sudo k3s kubectl exec deployment/orders-api-canary \
            -n "${NAMESPACE}" \
            -- node --input-type=module -e \
            "const response = await fetch('http://orders-api-canary-validation:3000/health'); console.log(await response.text()); if (!response.ok) process.exit(1);"
          EOF

      - name: Enable Canary traffic
        run: |
          ssh -o StrictHostKeyChecking=accept-new \
            ubuntu@${SERVER_IP} \
            "NAMESPACE='${NAMESPACE}' bash -s" << 'EOF'
          set -e
          sudo k3s kubectl patch service orders-api-service \
            -n "${NAMESPACE}" \
            --type=json \
            -p='[{"op":"remove","path":"/spec/selector/track"}]'
          sudo k3s kubectl get endpointslices \
            -n "${NAMESPACE}" \
            -l kubernetes.io/service-name=orders-api-service \
            -o wide
          EOF

      - name: Validate Canary traffic
        run: |
          set -e
          for request in {1..20}; do
            curl -fsS --max-time 5 \
              http://${SERVER_IP}:30080/health > /dev/null
          done

      - name: Promote Canary to Stable
        run: |
          ssh -o StrictHostKeyChecking=accept-new \
            ubuntu@${SERVER_IP} \
            "CANARY_IMAGE='${CANARY_IMAGE}' NAMESPACE='${NAMESPACE}' bash -s" << 'EOF'
          set -e
          sudo k3s kubectl patch service orders-api-service \
            -n "${NAMESPACE}" \
            --type=merge \
            -p='{"spec":{"selector":{"app":"orders-api","track":"stable"}}}'
          sudo k3s kubectl set image deployment/orders-api-stable \
            orders-api="${CANARY_IMAGE}" \
            -n "${NAMESPACE}"
          sudo k3s kubectl rollout status deployment/orders-api-stable \
            -n "${NAMESPACE}" \
            --timeout=120s
          sudo k3s kubectl delete deployment orders-api-canary \
            -n "${NAMESPACE}"
          sudo k3s kubectl get pods \
            -n "${NAMESPACE}" \
            -o custom-columns='NAME:.metadata.name,IMAGE:.spec.containers[0].image,TRACK:.metadata.labels.track'
          EOF

      - name: Verify promoted Stable
        run: |
          curl -fsS --retry 3 --max-time 10 \
            http://${SERVER_IP}:30080/health

      - name: Register successful promotion
        if: success()
        run: |
          echo "## Canary promovida correctamente" >> "${GITHUB_STEP_SUMMARY}"
          echo "Imagen promovida: ${CANARY_IMAGE}" >> "${GITHUB_STEP_SUMMARY}"
          echo "Namespace: ${NAMESPACE}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Rollback Canary
        id: rollback
        if: failure()
        run: |
          ssh -o StrictHostKeyChecking=accept-new \
            ubuntu@${SERVER_IP} \
            "STABLE_IMAGE='${STABLE_IMAGE}' NAMESPACE='${NAMESPACE}' bash -s" << 'EOF'
          set -e
          sudo k3s kubectl patch service orders-api-service \
            -n "${NAMESPACE}" \
            --type=merge \
            -p='{"spec":{"selector":{"app":"orders-api","track":"stable"}}}'
          sudo k3s kubectl set image deployment/orders-api-stable \
            orders-api="${STABLE_IMAGE}" \
            -n "${NAMESPACE}"
          sudo k3s kubectl rollout status deployment/orders-api-stable \
            -n "${NAMESPACE}" \
            --timeout=120s
          sudo k3s kubectl delete deployment orders-api-canary \
            -n "${NAMESPACE}" \
            --ignore-not-found=true
          sudo k3s kubectl get pods \
            -n "${NAMESPACE}" \
            --show-labels
          EOF
          curl -fsS --retry 3 --max-time 10 \
            http://${SERVER_IP}:30080/health

      - name: Register rollback result
        if: failure()
        run: |
          echo "## Rollback Canary ejecutado" >> "${GITHUB_STEP_SUMMARY}"
          echo "Resultado del rollback: ${{ steps.rollback.outcome }}" >> "${GITHUB_STEP_SUMMARY}"
          echo "Imagen Stable restaurada: ${STABLE_IMAGE}" >> "${GITHUB_STEP_SUMMARY}"
          echo "Namespace: ${NAMESPACE}" >> "${GITHUB_STEP_SUMMARY}"